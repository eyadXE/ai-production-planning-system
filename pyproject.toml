[project]
name = "finalproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eyad Magdy", email = "eyadmagdywork@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
finalproject = "finalproject:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
